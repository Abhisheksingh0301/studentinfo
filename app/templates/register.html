{% extends "layout.html" %}
{% block title %}User Registration{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-4 sm:mt-6 px-4">

    <div class="bg-gray-800 rounded-xl shadow-2xl border border-gray-700 overflow-hidden">

        <div class="bg-gradient-to-r from-gray-700 to-gray-800 px-6 py-4 text-center border-b border-gray-700">
            <h2 class="text-xl font-bold text-gray-100 tracking-tight">
                Create Account
            </h2>
        </div>

        <form method="POST" class="px-6 py-5 space-y-3">

            <div>
                <label for="username" class="block text-gray-400 text-xs font-medium mb-1 tracking-wider">
                    Username
                </label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    required 
                    autocomplete="off"
                    class="w-full px-3 py-2 bg-gray-900 border border-gray-600 rounded-lg 
                           text-gray-100 text-sm focus:outline-none focus:border-yellow-500/70 focus:ring-2 focus:ring-yellow-500/30
                           transition duration-200"
                >
            </div>

            <div>
                <label for="email" class="block text-gray-400 text-xs font-medium mb-1 tracking-wider">
                    E-mail Address
                </label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    required
                    class="w-full px-3 py-2 bg-gray-900 border border-gray-600 rounded-lg 
                           text-gray-100 text-sm focus:outline-none focus:border-yellow-500/70 focus:ring-2 focus:ring-yellow-500/30
                           transition duration-200"
                >
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label for="password" class="block text-gray-400 text-xs font-medium mb-1  tracking-wider">
                        Password
                    </label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required
                        class="w-full px-3 py-2 bg-gray-900 border border-gray-600 rounded-lg 
                               text-gray-100 text-sm focus:outline-none focus:border-yellow-500/70 focus:ring-2 focus:ring-yellow-500/30"
                    >
                </div>
                <div>
                    <label for="confirm_password" class="block text-gray-400 text-xs font-medium mb-1 tracking-wider">
                        Confirm
                    </label>
                    <input 
                        type="password" 
                        id="confirm_password" 
                        name="confirm_password" 
                        required
                        class="w-full px-3 py-2 bg-gray-900 border border-gray-600 rounded-lg 
                               text-gray-100 text-sm focus:outline-none focus:border-yellow-500/70 focus:ring-2 focus:ring-yellow-500/30"
                    >
                </div>
            </div>

            <button 
                type="submit"
                class="w-full bg-gradient-to-r from-yellow-600 to-yellow-500 
                       hover:from-yellow-500 hover:to-yellow-400 cursor-pointer
                       text-gray-900 font-bold py-2.5 px-6 rounded-lg
                       shadow-md transform hover:-translate-y-0.5
                       transition-all duration-300 mt-2"
            >
                Register
            </button>

            <div class="text-center text-xs pt-2">
                <p class="text-gray-400">
                    Already have an account? 
                    <a href="/login" class="text-yellow-400 hover:text-yellow-300 font-medium transition-colors">
                        Login here
                    </a>
                </p>
            </div>

        </form>
    </div>
</div>
{% endblock %}
